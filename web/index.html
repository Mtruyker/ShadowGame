<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101125">
  <title>Прыжок по тени</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101125; }
    body { touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
    #game {
      position: fixed;
      inset: 0;
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
    }
  </style>
  <script src="platform.js"></script>
</head>
<body>
  <div id="game"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
